[project]
name = "whisper-memo"
version = "0.1.0"
description = "Record voice memos in your terminal and transcribe them locally with Whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "adamhp" }]
requires-python = ">=3.11"
keywords = ["whisper", "speech-to-text", "transcription", "voice-memo", "cli", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "av<16",
    "faster-whisper>=1.2.1",
    "numpy>=1.24",
    "pyperclip>=1.9",
    "rich>=13",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
# GPU acceleration on Linux/Windows with an NVIDIA card. Large download; not needed for CPU.
cuda = [
    "nvidia-cublas-cu12<12.9; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
whisper-memo = "whisper_memo.cli:main"

[project.urls]
Homepage = "https://github.com/adamhp/whisper-memo"
Issues = "https://github.com/adamhp/whisper-memo/issues"
Changelog = "https://github.com/adamhp/whisper-memo/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
